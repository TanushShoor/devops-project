name: StudySpace CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Run API tests
        run: pytest -v
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  build-scan-push:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/study-planner-backend:${{ github.sha }} ./backend
      - name: Build frontend image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/study-planner-frontend:${{ github.sha }} ./frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/study-planner-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/study-planner-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Push SHA-tagged images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/study-planner-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/study-planner-frontend:${{ github.sha }}

  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_TO_EKS == 'true'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Configure kubectl
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          test -n "$KUBE_CONFIG_DATA" || { echo "KUBE_CONFIG_DATA is required when DEPLOY_TO_EKS=true"; exit 1; }
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Deploy StudySpace with Helm
        run: |
          helm upgrade --install study-planner ./helm/taskboard -n study-planner --create-namespace \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            --set backend.image=ghcr.io/${{ github.repository_owner }}/study-planner-backend \
            --set frontend.image=ghcr.io/${{ github.repository_owner }}/study-planner-frontend
