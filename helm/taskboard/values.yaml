frontend:
  image: ghcr.io/YOUR_ORG/study-planner-frontend
  tag: latest
backend:
  image: ghcr.io/YOUR_ORG/study-planner-backend
  tag: latest
replicaCount: 2
namespace: taskboard
imagePullSecrets: []
postgres:
  host: taskboard-postgres
  database: studyplanner
  username: studyplanner
  password: change-me-before-deploy
ingress:
  enabled: false
  host: studyspace.local
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
monitoring:
  serviceMonitor:
    enabled: true
